name: kambate_mobile
description: "OmniScore — Resultados y estadísticas multideporte en tiempo real."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing / Navigation
  go_router: ^17.3.0

  # Backend & Realtime
  supabase_flutter: ^2.16.0

  # Environment Variables
  flutter_dotenv: ^5.2.1

  # Networking & Utilities
  dio: ^5.8.0+1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/images/
    - assets/logo/
    - .env
    - .env.example
